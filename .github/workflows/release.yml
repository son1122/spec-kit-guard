name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tag matches the manifests
        # The catalog's download_url embeds the tag. If they disagree, the
        # release publishes assets at a URL the catalog never points at, and
        # `specify extension add` 404s for everyone.
        run: |
          bash scripts/build-catalog.sh --check
          manifest_version="$(grep -E '^  version:' extensions/guard/extension.yml \
            | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi

      - name: Run the smoke suite before publishing
        run: bash tests/smoke.sh

      - name: Build extension archives
        run: |
          cd extensions
          for e in guard converge-loop; do
            (cd "$e" && zip -qr "../$e.zip" .)
            echo "built $e.zip"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            extensions/guard.zip extensions/converge-loop.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
